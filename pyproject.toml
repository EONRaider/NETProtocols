[project]
name = "netprotocols"
version = "1.1.0"
description = "Low-level implementations of common networking protocols"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EONRaider", email = "livewire_voodoo@protonmail.com" }]
requires-python = ">=3.12"
keywords = ["networking", "protocols", "packet", "ethernet", "tcp", "ip", "arp", "icmp", "udp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/EONRaider/NETProtocols"
Repository = "https://github.com/EONRaider/NETProtocols"
Changelog = "https://github.com/EONRaider/NETProtocols/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netprotocols"]

[tool.ruff]
line-length = 80
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "UP",        # pyupgrade
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["netprotocols"]

[tool.coverage.report]
show_missing = true
