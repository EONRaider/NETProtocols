version: 2

updates:
  # --- Python tooling, managed by uv --------------------------------
  #
  # This project's dependencies are declared only as PEP 735
  # [dependency-groups] in pyproject.toml (see uv.lock). The "uv"
  # ecosystem parses [dependency-groups]; Dependabot's "pip" ecosystem
  # does not.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      # The "dev" dependency-group's packages (pytest, mypy, ruff, etc.),
      # updated together in one PR. Matched by package name: for the uv
      # ecosystem, Dependabot's dependency-type classifier reports every
      # dependency as "production" (dependabot/dependabot-core#13202),
      # so a `dependency-type: development` group would be empty. A
      # runtime dependency under [project.dependencies] is not in this
      # list, and updates in a PR of its own.
      dev-dependencies:
        patterns:
          - "hypothesis"
          - "mypy"
          - "pytest"
          - "pytest-cov"
          - "ruff"

  # --- GitHub Actions -------------------------------------------------
  #
  # Keeps the SHA-pinned `uses:` references in .github/workflows current
  # (Dependabot updates both the pinned SHA and its trailing `# vX.Y.Z`
  # comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # github/codeql-action ships init, analyze, and upload-sarif as
      # subdirectories of one repository, and Dependabot tracks each
      # `uses:` path as its own dependency. init and analyze must run
      # the same release: analyze refuses a config file written by a
      # different init version. This group bumps all three in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
