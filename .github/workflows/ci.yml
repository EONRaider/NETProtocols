name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # release.yml calls this workflow to run the same ladder against a
  # tagged commit before publishing.
  workflow_call:

# A newer run for the same pull request (keyed on its number) or ref
# cancels the older one. The group's prefix is the literal "ci", so it
# never equals release.yml's own group when release.yml calls this
# workflow.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job only reads the checked-out tree.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv run ruff check
      - run: uv run ruff format --check
      # pydoclint, run as a flake8 plugin with the settings in .flake8.
      - run: uv run flake8 src
      # Fails on any work-marker word in tracked text (see
      # scripts/check_markers.py). Offline.
      - run: python3 scripts/check_markers.py
      # Runs scripts/check_fixtures.py, stdlib-only, under the runner's
      # python3 over tests/fixtures and over each subdirectory holding a
      # tracked capture; fails if no capture is tracked or if any
      # directory's run exits non-zero. tests/test_check_fixtures.py
      # also runs it over every capture directory under each Python the
      # test job's matrix names. It runs whether or not an earlier step
      # failed.
      - name: Check every committed capture with check_fixtures.py
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(
            git ls-files -- 'tests/fixtures/*.pcap' | xargs -n1 dirname | sort -u
          )
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::git ls-files found no capture under tests/fixtures."
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            python3 scripts/check_fixtures.py "$dir"
          done
      # Renders every docstring in src/ through Sphinx autodoc
      # (docs/conf.py) and fails on any warning, an unresolved
      # cross-reference role included. Fetches the Python inventory from
      # docs.python.org; the dummy builder writes no output.
      - run: uv run --frozen sphinx-build -W -n -b dummy docs "$RUNNER_TEMP/sphinx"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # Also runs the doctests in src/: pyproject.toml's pytest
      # addopts and testpaths include --doctest-modules and src.
      - run: uv run --frozen pytest --cov=netprotocols --cov-report=term
      # Runs every module that measures allocations with
      # tests/conftest.py's allocation_peak while tracemalloc is already
      # tracing from interpreter start.
      - name: Allocation tests under PYTHONTRACEMALLOC=1
        env:
          PYTHONTRACEMALLOC: "1"
        run: >-
          uv run --frozen pytest -o addopts="" -q
          tests/test_conftest.py tests/test_cdp.py tests/test_lldp.py
          tests/test_pcap.py tests/test_sctp.py tests/test_stp.py
          tests/test_reassembly_memory.py

  # Scans the dev dependency group (the only third-party code CI itself
  # installs) for known vulnerabilities. --no-emit-project leaves out
  # the `-e .` line for this package, which has no hash: pip-audit
  # requires a hash on every requirement once any one carries a hash.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Export dev dependencies
        run: >-
          uv export --group dev --format requirements-txt --no-emit-project
          -o requirements-dev.txt
      - name: Audit dev dependencies for known vulnerabilities
        run: >-
          uv run --with pip-audit --no-project
          pip-audit -r requirements-dev.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import netprotocols; print(netprotocols.__version__)"
      # Two back-to-back builds must emit byte-identical wheels: the step
      # compares their sha256 and fails on any difference, such as an
      # embedded timestamp or a change in archive member order.
      - name: Verify the wheel build is reproducible
        run: |
          set -euo pipefail
          uv build -o dist-repro-1
          uv build -o dist-repro-2
          hash1=$(sha256sum dist-repro-1/*.whl | cut -d ' ' -f1)
          hash2=$(sha256sum dist-repro-2/*.whl | cut -d ' ' -f1)
          echo "Build 1 sha256: $hash1"
          echo "Build 2 sha256: $hash2"
          if [ "$hash1" != "$hash2" ]; then
            echo "::error::Wheel build is not reproducible: sha256 differs between two successive 'uv build' runs."
            exit 1
          fi
          echo "Wheel build is reproducible."

  # Checks the README's browser/WASM claim: boots a Pyodide runtime
  # under Node (scripts/pyodide/run_in_pyodide.mjs) and decodes the
  # whole real-capture corpus with the wheel this job builds.
  # scripts/pyodide/check_in_pyodide.py describes the checks.
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: scripts/pyodide
      - run: >-
          node scripts/pyodide/run_in_pyodide.mjs
          "$GITHUB_WORKSPACE" scripts/pyodide/check_in_pyodide.py

  # Blocking: runs scripts/benchmark_ab.py, which times this tree and a
  # base tree decoding this tree's tests/fixtures, in alternating pairs
  # of fresh processes on this runner, and fails when the median ratio
  # of head time to base time is more than the script's threshold above
  # 1.0. The head is the pull request's head commit, or the pushed
  # commit; scripts/benchmark_base.sh picks the base: the merge-base
  # with the base branch for a pull request, otherwise the commit before
  # the push, or HEAD^1. fetch-depth: 0 puts both in the clone.
  # benchmark-noise.yml runs the same comparison with the base equal to
  # the head. The last step reports dpkt's and scapy's throughput on the
  # same corpus and gates nothing.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Choose the base commit
        id: base
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          commit=$(scripts/benchmark_base.sh)
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - name: Decode time against the base
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.commit }}
        run: |
          # The step exits with the comparison's own status, saved in
          # $status before its output is copied to the step summary.
          status=0
          uv run --frozen python scripts/benchmark_ab.py --base "$BASE" \
            >benchmark.out 2>&1 || status=$?
          {
            echo '```'
            cat benchmark.out
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat benchmark.out
          exit "$status"
      - name: Throughput against dpkt and scapy
        run: uv run --frozen --group bench python scripts/benchmark.py --compare
