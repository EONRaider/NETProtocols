name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Callable so the release workflow can run this exact ladder against a
  # tagged commit before publishing (see release.yml). Keeping one
  # definition means the release gate cannot drift from the PR gate.
  workflow_call:

# Cancel a stale run the moment a newer one starts for the same branch
# or pull request, so a quick follow-up push doesn't leave two ladders
# racing for runners. Keyed on the PR number when this is a pull_request
# run and on the ref otherwise, so push/workflow_call runs on distinct
# refs (e.g. master vs. a release tag) never share a group and cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job here needs to write anything -- lint/typecheck/test/build/pyodide/
# benchmark all read the checked-out tree and call out to local tools.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --frozen pytest --cov=netprotocols --cov-report=term

  # Scans the dev dependency group (the only third-party code CI itself
  # pulls in) for known vulnerabilities. Exported with --no-emit-project
  # so the audit sees pinned, hashed third-party requirements only --
  # not an unhashable `-e .` reference to this repo's own in-tree
  # package, which pip-audit cannot install under --require-hashes
  # (implied automatically once any requirement carries a hash).
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Export dev dependencies
        run: >-
          uv export --group dev --format requirements-txt --no-emit-project
          -o requirements-dev.txt
      - name: Audit dev dependencies for known vulnerabilities
        run: >-
          uv run --with pip-audit --no-project
          pip-audit -r requirements-dev.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import netprotocols; print(netprotocols.__version__)"
      # Builds are supposed to be a pure function of the source tree, so
      # two runs back-to-back must emit byte-identical wheels. Diffing
      # their sha256 (rather than the files directly) catches drift
      # from things like embedded timestamps or non-deterministic
      # archive member ordering without needing a full binary diff.
      - name: Verify the wheel build is reproducible
        run: |
          set -euo pipefail
          uv build -o dist-repro-1
          uv build -o dist-repro-2
          hash1=$(sha256sum dist-repro-1/*.whl | cut -d ' ' -f1)
          hash2=$(sha256sum dist-repro-2/*.whl | cut -d ' ' -f1)
          echo "Build 1 sha256: $hash1"
          echo "Build 2 sha256: $hash2"
          if [ "$hash1" != "$hash2" ]; then
            echo "::error::Wheel build is not reproducible: sha256 differs between two successive 'uv build' runs."
            exit 1
          fi
          echo "Wheel build is reproducible."

  # Proves the README's browser/WASM claim (#99) against the real
  # thing, not a simulation of it: boots an actual Pyodide runtime
  # (scripts/pyodide/run_in_pyodide.mjs, via Node — no browser needed,
  # same WebAssembly build either way) and decodes the whole
  # real-capture corpus with the wheel this job just built. See
  # scripts/pyodide/check_in_pyodide.py for what it checks and why.
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: scripts/pyodide
      - run: >-
          node scripts/pyodide/run_in_pyodide.mjs
          "$GITHUB_WORKSPACE" scripts/pyodide/check_in_pyodide.py

  # Blocking, at 15% below the committed baseline. The threshold has
  # runner data behind it: this job's first run measured 3.7% away from
  # a baseline recorded on entirely different hardware, and run-to-run
  # spread on one machine is ~2%. 15% is therefore roughly four times
  # the noise it has to tolerate, which leaves real regressions (Tier 1
  # moved this number by 30-90% a step) nowhere to hide.
  #
  # A failure re-measures once before failing, because a shared runner
  # can lose a slice of CPU to a neighbour: a genuine regression fails
  # both attempts, a noisy one usually does not.
  #
  # Pinned to the baseline's interpreter on purpose: normalization
  # cancels how fast the machine is, not which CPython it runs (see the
  # module docstring in scripts/benchmark.py). If a change is a
  # deliberate trade, re-record with --update-baseline and say why.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Corpus decode throughput
        shell: bash
        run: |
          # Keep the benchmark's own exit status: piping the whole thing
          # into tee would report tee's, and wrapping it in a { } group
          # would report the trailing echo's -- either way the gate
          # would pass while the check failed.
          status=0
          uv run --frozen --group bench python scripts/benchmark.py \
            --check --threshold 15 --compare >benchmark.out 2>&1 || status=$?
          {
            echo '```'
            cat benchmark.out
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat benchmark.out
          exit "$status"
