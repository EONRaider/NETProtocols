name: Release

on:
  push:
    tags: ["v*"]

# Serialize runs for the same tag/ref instead of cancelling one mid-publish:
# a release that's already uploading to PyPI or cutting a GitHub release
# must run to completion, so a re-trigger queues behind it rather than
# tearing it down.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs the full QA ladder against the tagged commit before anything is
  # uploaded. ci.yml's own triggers fire on pushes and pull requests
  # targeting master, which a tag push matches neither of, and a tag can
  # point at a commit that is not on master.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      # Fails unless the tag names the version of the wheel about to be
      # uploaded, read back out of the built artifact.
      - name: Verify the tag matches the version being published
        run: |
          set -euo pipefail
          # The tag must start with "v", here as in the trigger.
          case "${GITHUB_REF_NAME}" in
            v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)
              echo "::error::Tag ${GITHUB_REF_NAME} does not start with 'v'."
              echo "Release tags must be of the form v<version>." >&2
              exit 1
              ;;
          esac
          built=$(uv run --isolated --no-project --with dist/*.whl \
            python -c \
            "from importlib.metadata import version; print(version('netprotocols'))")
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would publish version ${built}."
            echo "The tag and the packaged version must agree." >&2
            echo "Either retag as v${built}, or set the version in" >&2
            echo "pyproject.toml (and __version__) to ${tag} and retag." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches packaged version ${built}."
      # Attests, verifiably through GitHub's attestation API, that this
      # workflow run built the wheel and sdist from this commit. It runs
      # before publishing, so a failed attestation stops the release.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # attest-build-provenance stores the attestation through GitHub's
      # API and attaches nothing to the release. This copies its bundle
      # to netprotocols-<version>.sigstore.json, which the
      # github-release job uploads as a release asset.
      - name: Rename provenance bundle for release upload
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "netprotocols-${GITHUB_REF_NAME#v}.sigstore.json"
      # A CycloneDX SBOM of the wheel about to be published: netprotocols
      # alone, which has no runtime dependencies.
      - name: Generate SBOM
        run: |
          uv venv .sbom-venv
          uv pip install --python .sbom-venv/bin/python dist/*.whl
          uvx --from cyclonedx-bom cyclonedx-py environment .sbom-venv \
            --pyproject pyproject.toml --mc-type library \
            -o "netprotocols-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            netprotocols-*.sigstore.json
            netprotocols-*.cdx.json
          retention-days: 5
      # Publishes to PyPI as a trusted publisher, bound to this
      # repository, this workflow file and the pypi environment, and
      # authenticated through `id-token: write` above. Scorecard's
      # Packaging check recognizes this action's `uses:` line.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
      # The release notes are this tag's section of CHANGELOG.md; a
      # missing section fails the job.
      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            found && /^## \[/ { exit }
            found { print }
            $0 ~ "^## \\[" ver "\\]" { found=1 }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [${version}]' section found in CHANGELOG.md."
            exit 1
          fi
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "netprotocols ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest \
            netprotocols-*.sigstore.json netprotocols-*.cdx.json
