name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Run the full QA ladder against the tagged commit before anything is
  # uploaded. This is not redundant with the CI workflow's own triggers:
  # those fire on pushes and pull requests targeting master, and a tag
  # push matches neither, so without this job a release ran no checks at
  # all. A tag can also point at a commit that never landed on master.
  # A published version can only be yanked, never replaced.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # The QA ladder cannot catch a mistagged release: every check
      # passes because the code is fine and only the tag is wrong. Read
      # the version back out of the artifact that is about to be
      # uploaded, rather than re-parsing pyproject.toml, so this
      # compares against what PyPI will actually receive.
      - name: Verify the tag matches the version being published
        run: |
          set -euo pipefail
          # Only the "v*" trigger keeps a bare "1.3.0" tag from reaching
          # this step, where it would compare equal and pass. Check the
          # prefix here too, so the contract survives a wider trigger.
          case "${GITHUB_REF_NAME}" in
            v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)
              echo "::error::Tag ${GITHUB_REF_NAME} does not start with 'v'."
              echo "Release tags must be of the form v<version>." >&2
              exit 1
              ;;
          esac
          built=$(uv run --isolated --no-project --with dist/*.whl \
            python -c \
            "from importlib.metadata import version; print(version('netprotocols'))")
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would publish version ${built}."
            echo "The tag and the packaged version must agree." >&2
            echo "Either retag as v${built}, or set the version in" >&2
            echo "pyproject.toml (and __version__) to ${tag} and retag." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches packaged version ${built}."
      - run: uv publish --trusted-publishing always

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # CHANGELOG.md is the single source of truth for release notes, so
      # extract this tag's own section rather than maintaining a second
      # copy anywhere. A missing section fails loudly instead of
      # publishing an empty-body release.
      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            found && /^## \[/ { exit }
            found { print }
            $0 ~ "^## \\[" ver "\\]" { found=1 }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [${version}]' section found in CHANGELOG.md."
            exit 1
          fi
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "netprotocols ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest
