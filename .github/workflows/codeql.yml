name: CodeQL

# CodeQL advanced setup: the Python analysis is configured in this file.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Sundays at 06:00 UTC, clear of the other workflows'
    # cron slots.
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-mode: none extracts the database straight from source,
      # with no build step.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none

      # analyze writes the SARIF without uploading it, the filter step
      # drops one query's results on two paths, and upload-sarif uploads
      # what is left. py/weak-sensitive-data-hashing flags the MD5 that
      # RADIUS and STUN mandate, which their tests and
      # scripts/check_fixtures.py compute over published test secrets
      # with usedforsecurity=False to verify captured traffic. The
      # filter removes only that query's results whose primary location
      # is under tests/ or scripts/; the query still runs on src/, every
      # other query on all three.
      #
      # upload: failure-only is the action's documented mode for a
      # workflow that post-processes the SARIF: analyze uploads nothing
      # when it succeeds. It still marks the analysis as completed, so
      # init's post step does not upload a failed-run SARIF for a later
      # step's failure either: if the filter or upload-sarif fails, the
      # job goes red and no new analysis replaces the previous one
      # (upload-sarif can fail after uploading, while it waits for
      # processing). That fails closed; unfiltered SARIF is never
      # uploaded. (Any value the action does not recognize means
      # `always`, which would upload before the filter runs.)
      #
      # Neither analyze nor upload-sarif sets `category`, and that is
      # what keeps the analysis the same one: with no category the CLI
      # writes no runs[].automationDetails, and both actions then fill
      # it in from the workflow path, job id and matrix,
      # ".github/workflows/codeql.yml:analyze/", the same in both
      # steps of this job. Existing alerts keep tracking (fixed ones
      # close, the rest stay) rather than reappearing under a new
      # category. Setting one on either step alone would start a second
      # analysis next to the first.
      - id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: failure-only

      # Rewrites each *.sarif under analyze's output directory, at any
      # depth and skipping symlinks (as upload-sarif finds them), in
      # place and logs one line per file, by its path under the
      # directory, naming every result it dropped; malformed SARIF fails
      # the job instead of uploading unfiltered results.
      # Stdlib only, so the runner's own python3 runs it.
      - name: Drop weak-hashing results on tests/ and scripts/
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/filter_codeql_sarif.py "$SARIF_DIR"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
