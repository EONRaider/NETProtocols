name: CodeQL

# Advanced-setup workflow (a checked-in file) rather than GitHub's
# built-in "default setup", so this analysis lives in version control
# alongside the rest of this repository's CI (ci.yml, fuzz.yml,
# release.yml, mutation.yml, scorecard.yml) and its action pins are
# reviewable the same way theirs are. Default setup is configured
# through repository settings instead of a file, so it isn't available
# to author from here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Arbitrary; weekly on Sundays, clear of fuzz.yml's and mutation.yml's
    # daily 03:00/04:00 UTC slots and scorecard.yml's own Sunday 05:00
    # UTC slot.
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python is interpreted, so there is nothing for autobuild (or a
      # manual build step) to do: build-mode: none has CodeQL extract
      # the database straight from source instead. This is the build
      # mode the CodeQL Action's own docs recommend for interpreted
      # languages, and it sidesteps the question of an autobuild step
      # fitting this project's uv-based build at all.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none

      # analyze writes the SARIF without uploading it, the filter step
      # drops one query's results on two paths, and upload-sarif uploads
      # what is left. py/weak-sensitive-data-hashing flags the MD5 that
      # protocols such as RADIUS and STUN mandate (RADIUS authenticators,
      # User-Password hiding and CHAP; STUN's long-term-credential key),
      # which tests/ and scripts/check_fixtures.py compute over published
      # test secrets with usedforsecurity=False to verify captured
      # traffic (#265).
      # The CodeQL config can't scope a query to paths: query-filters
      # drops it everywhere, src/ included, and paths-ignore drops the
      # paths from every query. So the filter removes only that query's
      # results whose primary location is under tests/ or scripts/; the
      # query still runs on src/, every other query on all three.
      #
      # upload: failure-only is the action's documented mode for a
      # workflow that post-processes the SARIF: analyze uploads nothing
      # when it succeeds. It still marks the analysis as completed, so
      # init's post step does not upload a failed-run SARIF for a later
      # step's failure either: if the filter or upload-sarif fails, the
      # job goes red, nothing is uploaded, and the previous analysis
      # stays current. That fails closed; unfiltered SARIF is never
      # uploaded. (Any value the action does not recognize means
      # `always`, which would upload before the filter runs.)
      #
      # Neither analyze nor upload-sarif sets `category`, and that is
      # what keeps the analysis the same one: with no category the CLI
      # writes no runs[].automationDetails, and both actions then fill
      # it in from the workflow path, job id and matrix,
      # ".github/workflows/codeql.yml:analyze/", the same in both
      # steps of this job. Existing alerts keep tracking (fixed ones
      # close, the rest stay) rather than reappearing under a new
      # category. Setting one on either step alone would start a second
      # analysis next to the first.
      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: failure-only

      # Rewrites each *.sarif under analyze's output directory, at any
      # depth (as upload-sarif finds them), in place and logs one line
      # per file naming every result it dropped; malformed SARIF fails
      # the job instead of uploading unfiltered results.
      # Stdlib only, so the runner's own python3 runs it.
      - name: Drop weak-hashing results on tests/ and scripts/
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/filter_codeql_sarif.py "$SARIF_DIR"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
