name: Nightly fuzz

on:
  schedule:
    # Daily at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keyed on the triggering event too, so the nightly cron can never
# cancel a manually dispatched run on the same ref (RELEASE.md's
# "Pass the pre-tag gates on `master`" section relies on one) -- runs
# of the same kind still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the whole suite under tests/test_fuzz.py's "nightly" profile:
  # 10,000 examples with a random seed each run (see tests/test_fuzz.py's
  # module docstring), where the "netprotocols" profile CI uses runs
  # the same 200 derandomized inputs every time. Python 3.12 only.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # Keyed by run id with a prefix restore-key: restores the most
      # recent run's Hypothesis example database and saves this run's as
      # a new entry (actions/cache never overwrites an existing key), so
      # the database accumulates from run to run.
      - name: Restore accumulated Hypothesis examples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-nightly-${{ github.run_id }}
          restore-keys: |
            hypothesis-nightly-
      - name: Run the full suite under the nightly fuzz profile
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run --frozen pytest
      # On failure, uploads the example database, which holds the
      # minimal counterexample.
      - name: Upload the failing example database
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypothesis-nightly-failure-${{ github.run_id }}
          path: .hypothesis
          retention-days: 30

  # Coverage-guided fuzzing with Atheris: libFuzzer's mutation engine
  # drives decode_frame, and HTTP.decode, which decode_frame never
  # reaches (HTTP is not port-dispatched), through a harness of its
  # own. Python 3.12 only.
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Run Atheris against decode_frame
        run: |
          uv run --frozen --with atheris \
            python tests/fuzz/fuzz_decode_frame.py -max_total_time=300
      - name: Run Atheris against HTTP.decode
        run: |
          uv run --frozen --with atheris \
            python tests/fuzz/fuzz_http_decode.py -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atheris-crash-${{ github.run_id }}
          path: crash-*
          retention-days: 30
