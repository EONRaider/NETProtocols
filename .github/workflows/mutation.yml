name: Nightly mutation testing

on:
  schedule:
    # Daily at 04:00 UTC, an hour after fuzz.yml.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Keyed on the triggering event too, so the nightly cron never cancels
# a manually dispatched run on the same ref, such as the one RELEASE.md's
# "7. Pass the pre-tag gates on `master`" section dispatches; runs of
# the same kind still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 3.12 only.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install the project with dev dependencies
        run: uv sync --group dev --frozen
      # only_mutate in pyproject.toml's [tool.mutmut] table limits
      # mutation to four files: src/netprotocols/checksum.py, _tlv.py,
      # layer7/dns.py and layer7/http.py. These positional filters
      # narrow that below a file, which mutmut's config cannot: in
      # dns.py they keep only the name-compression byte walk,
      # _read_name and _labels, and leave out the record, RDATA and
      # dataclass code; in http.py they keep the private module-level
      # functions, the HTTP/1.1 grammar; checksum.py and _tlv.py are
      # mutated whole. A comment in the same [tool.mutmut] table gives
      # this command, and tests/test_workflows.py pins the filter set.
      # The checkout holds no mutants/ directory, so mutmut generates
      # every mutant, traces the configured test selection in full to
      # map each function to the tests that call it, and checks every
      # mutant the filters select.
      - name: Run mutmut against the scoped targets
        run: |
          uv run --frozen mutmut run \
            'netprotocols.checksum.*' \
            'netprotocols._tlv.*' \
            'netprotocols.layer7.dns.x__read_name*' \
            'netprotocols.layer7.dns.x__labels*' \
            'netprotocols.layer7.http.x__*'
      # `mutmut run` exits 0 however many mutants survive, so it can
      # never turn this job red on its own. This step is what does: it
      # fails on any undetected mutant not in the triage record
      # (scripts/mutmut_survivors.txt), on a stale entry there, and on
      # a scoped file with no checked mutant at all.
      - name: Fail on survivors outside the triage record
        run: |
          uv run --frozen mutmut results --all true > mutmut-results.txt
          uv run --frozen python scripts/check_mutmut_survivors.py \
            mutmut-results.txt
      # On failure, uploads the status listing and the mutants
      # directory, which holds mutmut's per-file results and its
      # function-to-test map; a path that does not exist is skipped.
      - name: Upload mutmut results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-nightly-failure-${{ github.run_id }}
          path: |
            mutmut-results.txt
            mutants
          if-no-files-found: ignore
          retention-days: 30
