name: Nightly mutation testing

on:
  schedule:
    # Daily at 04:00 UTC, an hour after fuzz.yml.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Keyed on the triggering event too, so the nightly cron can never
# cancel a manually dispatched run on the same ref (the release
# checklist in CONTRIBUTING.md relies on one) -- runs of the same kind
# still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 3.12 only.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      # Keyed by run id with a prefix restore-key: restores the most
      # recent run's mutmut cache and saves this run's as a new entry,
      # as fuzz.yml does.
      - name: Restore accumulated mutmut cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mutmut-cache
            mutants
          key: mutmut-nightly-${{ github.run_id }}
          restore-keys: |
            mutmut-nightly-
      # The restored cache also carries mutants/mutmut-stats.json, the
      # map from each function to the tests that call it. When that map
      # exists, mutmut 3.8 re-traces only tests it has never seen, so a
      # function added since the cached run (a new helper called only
      # by existing tests) maps to no tests and every one of its
      # mutants reads "no tests"; so does an existing test edited to
      # call a function it didn't before. Without the map, mutmut
      # traces the configured test selection in full, which costs one
      # traced pytest pass. Nothing else is lost: with the positional
      # filters below, mutmut re-runs every in-scope mutant regardless
      # of a cached result.
      - name: Drop the cached function-to-test map
        run: rm -f mutants/mutmut-stats.json
      - name: Install the project with dev dependencies
        run: uv sync --group dev --frozen
      # File-level scope (src/netprotocols/checksum.py, _tlv.py,
      # layer7/dns.py and layer7/http.py) comes from only_mutate in
      # pyproject.toml's [tool.mutmut] table. dns.py's in-scope surface
      # is narrower: only the name-compression byte walk, not the
      # record/RDATA/dataclass code the rest of the file holds. mutmut
      # has no config-level way to express that, so these positional
      # filters narrow it; they are the ones documented next to
      # only_mutate in pyproject.toml, and tests/test_workflows.py pins
      # them.
      - name: Run mutmut against the scoped targets
        run: |
          uv run --frozen mutmut run \
            'netprotocols.checksum.*' \
            'netprotocols._tlv.*' \
            'netprotocols.layer7.dns.x__read_name*' \
            'netprotocols.layer7.dns.x__labels*' \
            'netprotocols.layer7.http.x__*'
      # `mutmut run` exits 0 however many mutants survive, so it can
      # never turn this job red on its own. This step is what does: it
      # fails on any undetected mutant not in the triage record
      # (scripts/mutmut_survivors.txt), on a stale entry there, and on
      # a scoped file with no checked mutant at all.
      - name: Fail on survivors outside the triage record
        run: |
          uv run --frozen mutmut results --all true > mutmut-results.txt
          uv run --frozen python scripts/check_mutmut_survivors.py \
            mutmut-results.txt
      # On failure, uploads the status listing, the .mutmut-cache file
      # and the mutants directory; a path that does not exist is
      # skipped.
      - name: Upload mutmut results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-nightly-failure-${{ github.run_id }}
          path: |
            mutmut-results.txt
            .mutmut-cache
            mutants
          if-no-files-found: ignore
          retention-days: 30
