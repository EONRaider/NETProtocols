name: Docs lint

# Runs lycheeverse/lychee (a link checker) over the small set of
# hand-maintained docs that carry the project's external claims and
# cross-references: README.md, ARCHITECTURE.md, CONTRIBUTING.md,
# RELEASE.md, CHANGELOG.md, and docs/CLAIMS.md. The pull_request
# trigger, filtered to those paths, checks the links of a docs edit; the
# weekly schedule checks the links of unchanged files, which can go dead.
on:
  pull_request:
    branches: [master]
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "RELEASE.md"
      - "CHANGELOG.md"
      - "docs/CLAIMS.md"
  schedule:
    # Weekly on Mondays at 06:00 UTC, clear of the other workflows'
    # cron slots.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lychee-action's `token` input defaults to `${{ github.token }}`,
      # which it exports as GITHUB_TOKEN; lychee checks github.com links
      # through the API with it, under the authenticated rate limit.
      #
      # --timeout/--max-retries/--retry-wait-time exceed lychee's own
      # defaults (20s/3/1s), so a slow or briefly rate-limited external
      # host does not fail the run.
      #
      # --include-fragments also checks each link's #fragment: against
      # the headings of a linked Markdown file, and against the ids and
      # anchor names of a linked HTML page.
      #
      # --exclude skips img.shields.io, which serves the README badges
      # and intermittently rate-limits or times out under CI traffic. It
      # is the only exclusion.
      - name: Check links in the project's hand-maintained docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --verbose
            --timeout 30
            --max-retries 3
            --retry-wait-time 10
            --include-fragments
            --exclude '^https://img\.shields\.io'
            README.md
            ARCHITECTURE.md
            CONTRIBUTING.md
            RELEASE.md
            CHANGELOG.md
            docs/CLAIMS.md
